<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4 – Secure Connect Chat Client</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .chat-container {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 650px;
    }
    .chat-header {
      background: #1a73e8;
      color: white;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 12px;
      background: #34a853;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .room-setup {
      padding: 16px;
      background: #e8f0fe;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #d2e3fc;
    }
    .room-setup input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #c2d7fa;
      border-radius: 6px;
      font-size: 14px;
    }
    .room-setup button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .room-setup button:hover { background: #1557b0; }
    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }
    .message-item {
      padding: 8px 14px;
      border-radius: 8px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.4;
    }
    .system-message {
      background: #f1f3f4;
      color: #5f6368;
      align-self: center;
      font-size: 12px;
      font-style: italic;
    }
    .user-message {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
    }
    .my-message {
      background: #dcf8c6;
      align-self: flex-end;
    }
    .sender-name {
      font-weight: 600;
      font-size: 11px;
      color: #1a73e8;
      margin-bottom: 2px;
    }
    .timestamp {
      font-size: 10px;
      color: #888;
      text-align: right;
      margin-top: 4px;
    }
    .input-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .input-area button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .input-area button:hover { background: #1557b0; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <span>Socket.IO Real-Time Chat (Lab 4)</span>
      <span id="status" class="status-badge">Connecting...</span>
    </div>

    <div class="room-setup">
      <input type="text" id="username" placeholder="Your name (e.g. Alice)" value="Alice" />
      <input type="text" id="room" placeholder="Room (e.g. general)" value="general" />
      <button onclick="joinRoom()">Join Room</button>
    </div>

    <div id="messages" class="messages-area">
      <div class="message-item system-message">Connect to server, enter room, and start chatting.</div>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoom = 'general';
    let currentUsername = 'Alice';

    const statusBadge = document.getElementById('status');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');

    socket.on('connect', () => {
      statusBadge.textContent = 'Connected: ' + socket.id.substring(0, 5) + '...';
      statusBadge.style.background = '#34a853';
    });

    socket.on('disconnect', () => {
      statusBadge.textContent = 'Disconnected';
      statusBadge.style.background = '#ea4335';
    });

    socket.on('receive_message', (data) => {
      appendMessage(data);
    });

    function joinRoom() {
      currentUsername = document.getElementById('username').value.trim() || 'Anonymous';
      currentRoom = document.getElementById('room').value.trim() || 'general';

      socket.emit('join_room', {
        username: currentUsername,
        room: currentRoom
      });

      appendMessage({
        sender: 'System',
        message: `You entered room: ${currentRoom} as "${currentUsername}"`,
        timestamp: new Date().toISOString()
      });
    }

    function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;

      socket.emit('send_message', {
        room: currentRoom,
        sender: currentUsername,
        message: msg
      });

      messageInput.value = '';
    }

    function appendMessage(data) {
      const isSystem = data.sender === 'System';
      const isMe = data.sender === currentUsername;

      const div = document.createElement('div');
      div.className = `message-item ${isSystem ? 'system-message' : isMe ? 'my-message' : 'user-message'}`;

      const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';
      div.innerHTML = `
        ${!isSystem ? `<div class="sender-name">${data.sender}</div>` : ''}
        <div>${data.message}</div>
        ${time ? `<div class="timestamp">${time}</div>` : ''}
      `;

      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
  </script>
</body>
</html>
